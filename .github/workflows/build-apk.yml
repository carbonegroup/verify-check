name: Build Android APK
# Build and upload a test-signed APK with the Android Gradle toolchain.

on:
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional app version override"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: verifycheck-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Create mobile .env (public EXPO_PUBLIC_* values)
        working-directory: mobile
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://hdfefhltqyxiqnuruhlp.supabase.co" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_6QbAwQ2hnt8qCeUPVCXJ5w_MSO0APSP" >> .env
          echo "EXPO_PUBLIC_API_BASE_URL=https://verify-check-one.vercel.app" >> .env

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: "1"
          APP_VERSION: ${{ inputs.version || '' }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 :app:assembleRelease

      - name: Verify and sign APK for device testing
        working-directory: mobile
        run: |
          set -euo pipefail

          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed without producing a release APK."
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi

          if ! "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo "Release APK is not signed; signing it with a temporary test key."
            KEYSTORE="$RUNNER_TEMP/verifycheck-test.keystore"
            SIGNED_APK="$RUNNER_TEMP/verifycheck-signed.apk"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass android \
              -keypass android \
              -alias verifycheck \
              -dname "CN=VerifyCheck Test,O=VerifyCheck,C=GN" \
              -keyalg RSA -keysize 2048 -validity 10000
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias verifycheck \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$SIGNED_APK" "$APK_PATH"
            APK_PATH="$SIGNED_APK"
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist/verifycheck.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/verifycheck.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/verifycheck.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: verifycheck-apk-${{ github.run_number }}
          path: dist/verifycheck.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish APK on GitHub Releases
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: verifycheck-apk-${{ github.run_number }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "VerifyCheck Android APK #${{ github.run_number }}"
          body: |
            Automatically built Android APK for VerifyCheck.

            Commit: ${{ github.sha }}
            Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This APK is signed for testing. A persistent production signing key is required for Play Store publication and seamless upgrades across separately built releases.
          files: dist/verifycheck.apk
          draft: false
          prerelease: false
          make_latest: true
