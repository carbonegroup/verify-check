name: Refresh mobile dependency lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/package.json"
      - ".github/workflows/refresh-mobile-lockfile.yml"

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      ${{ github.event.pull_request.number == 58 &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'security/dependabot-remediation-2026-11-23' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify dependency resolution and security audit
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm ls image-size --all
          npm audit --audit-level=low

      - name: Verify web dependency audit
        run: npm audit --audit-level=low

      - name: Commit lockfile and remove this temporary workflow
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git rm .github/workflows/refresh-mobile-lockfile.yml
          git commit -m "chore(deps): regenerate mobile lockfile for patched Metro parser"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
