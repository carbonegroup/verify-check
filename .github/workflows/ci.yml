name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      - name: Type check web
        run: npm run typecheck

      - name: Type check mobile
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Lint web
        run: npm run lint

      - name: Lint mobile
        run: npm run lint
        working-directory: mobile

      - name: Tests unitaires web
        run: npm test

      - name: Tests unitaires mobile
        run: npm test -- --passWithNoTests
        working-directory: mobile

      - name: Build web
        run: npm run build
        env:
          # Valeurs factices : le build ne doit pas nécessiter Supabase réel
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key