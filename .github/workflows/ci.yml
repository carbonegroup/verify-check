name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies from lockfile
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      - name: Verify Metro uses the patched image-size 1.x implementation
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "node_modules/metro/node_modules/image-size/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          if (pkg.name !== "image-size-next" || pkg.version !== "1.2.2") {
            throw new Error(`Unexpected Metro image-size resolution: ${pkg.name}@${pkg.version}`);
          }
          console.log(`Metro image-size resolved to ${pkg.name}@${pkg.version}`);
          NODE

      - name: Audit web dependencies
        run: npm audit --audit-level=low

      - name: Audit mobile dependencies
        run: npm audit --audit-level=low
        working-directory: mobile

      - name: Validate EAS Android build types
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          const allowed = new Set(["apk", "app-bundle"]);

          for (const [name, profile] of Object.entries(eas.build ?? {})) {
            const buildType = profile.android?.buildType;
            if (buildType !== undefined && !allowed.has(buildType)) {
              throw new Error(`build.${name}.android.buildType must be "apk" or "app-bundle"; received ${JSON.stringify(buildType)}`);
            }
          }

          for (const name of ["development", "preview"]) {
            const profile = eas.build?.[name];
            if (!profile) throw new Error(`Missing required APK profile: ${name}`);

            const distribution = profile.android?.distribution ?? profile.distribution;
            const effectiveType = profile.android?.buildType ??
              (profile.developmentClient || distribution === "internal" ? "apk" : "app-bundle");

            if (effectiveType !== "apk") {
              throw new Error(`The APK publishing workflow profile "${name}" resolves to "${effectiveType}".`);
            }
          }

          console.log("All EAS Android buildType values and APK publishing profiles are valid.");
          NODE
        working-directory: mobile

      - name: Validate Expo configuration
        run: |
          npx expo config --json > /tmp/expo-config.json
          APP_VERSION=0.1-dev npx expo config --json > /tmp/expo-version-config.json
          node <<'NODE'
          const fs = require("node:fs");
          const base = JSON.parse(fs.readFileSync("/tmp/expo-config.json", "utf8"));
          const versioned = JSON.parse(fs.readFileSync("/tmp/expo-version-config.json", "utf8"));

          if (base.version !== "1.0.0") {
            throw new Error(`Version Expo par défaut inattendue : ${base.version}`);
          }
          if (versioned.version !== "0.1-dev") {
            throw new Error(`APP_VERSION non appliquée : ${versioned.version}`);
          }
          console.log("Configuration Expo statique et surcharge APP_VERSION validées.");
          NODE
        working-directory: mobile

      - name: Export Android bundle with Metro
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/verifycheck-expo-export" --no-minify
        working-directory: mobile

      - name: Type check web
        run: npm run typecheck

      - name: Type check mobile
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Lint web
        run: npm run lint

      - name: Lint mobile
        run: npm run lint
        working-directory: mobile

      - name: Tests unitaires web
        run: npm test

      - name: Tests unitaires mobile
        run: npm test
        working-directory: mobile

      - name: Build web
        run: npm run build
        env:
          # Valeurs factices : le build ne doit pas nécessiter Supabase réel
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder_key