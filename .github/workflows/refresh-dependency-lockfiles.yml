name: Refresh dependency lockfiles

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "mobile/package.json"
      - ".github/workflows/refresh-dependency-lockfiles.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh web lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Capture npm audit reports
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-web.json" || true
          (cd mobile && npm audit --json > "$RUNNER_TEMP/audit-mobile.json") || true

      - name: Upload refreshed lockfiles and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-lockfile-refresh
          path: |
            package-lock.json
            mobile/package-lock.json
            ${{ runner.temp }}/audit-web.json
            ${{ runner.temp }}/audit-mobile.json
          if-no-files-found: error
          retention-days: 2
